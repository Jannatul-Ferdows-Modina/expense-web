<header class="app-header">
  <h1>Expense Tracker</h1>
  <p>Track spending, filter by month, stay on budget.</p>
</header>

<main class="layout">
  <div class="primary">
    <app-expense-form [editing]="editing()" (done)="editing.set(null)" />
    <app-filter-bar />
    <app-expense-list [expenses]="store.visible()" (edit)="editing.set($event)" (remove)="remove($event)" />
  </div>
  <aside class="secondary">
    <app-summary-panel />
    <app-budget-panel />
  </aside>
</main>
